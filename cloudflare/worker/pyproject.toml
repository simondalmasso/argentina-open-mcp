[project]
name = "argentina-open-data-cloudflare-worker"
version = "0.1.0"
description = "Cloudflare Python Worker for Argentina Open Data REST, MCP and web"
requires-python = ">=3.13"
dependencies = [
  "argentina-open-data",
]

[tool.uv.sources]
argentina-open-data = { path = "../.." }

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]
