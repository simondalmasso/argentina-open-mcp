name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify deployment credentials are configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository variable."
            exit 1
          }
      - name: Install uv
        run: python -m pip install uv
      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: uv sync --all-groups
      - name: Deploy arg-open
        working-directory: cloudflare/worker
        run: uv run pywrangler deploy
      - name: Verify published website, REST and MCP
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          BASE = "https://arg-open.simondalmasso44.workers.dev"

          def request_json(path, payload=None):
              if payload is None:
                  request = urllib.request.Request(BASE + path)
              else:
                  body = json.dumps(payload).encode()
                  request = urllib.request.Request(
                      BASE + path,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                      },
                      method="POST",
                  )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.loads(response.read().decode())

          deadline = time.monotonic() + 90
          last_error = None
          while time.monotonic() < deadline:
              try:
                  health = request_json("/health")
                  if health.get("status") == "ok":
                      break
              except (OSError, urllib.error.URLError, ValueError) as exc:
                  last_error = exc
              time.sleep(2)
          else:
              raise AssertionError("Deployed Worker did not become healthy") from last_error

          with urllib.request.urlopen(BASE + "/", timeout=15) as response:
              home = response.read().decode()
          assert "Argentina Open Data" in home

          snapshots = request_json("/api/v1/snapshots")
          assert snapshots["count"] == 1, snapshots
          assert snapshots["data"][0]["record_count"] == 24, snapshots

          territory = request_json(
              "/api/v1/territories?resource=provincias&q=Santa%20Fe"
          )
          assert territory["data"][0]["geo_id"] == "82", territory

          initialized = request_json("/mcp/", {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2025-03-26",
                  "capabilities": {},
                  "clientInfo": {"name": "cloudflare-production-smoke", "version": "1.0"},
              },
          })
          assert "result" in initialized, initialized

          listed = request_json("/mcp/", {
              "jsonrpc": "2.0",
              "id": 2,
              "method": "tools/list",
              "params": {},
          })
          names = [item["name"] for item in listed["result"]["tools"]]
          assert "search_territories" in names, names

          called = request_json("/mcp/", {
              "jsonrpc": "2.0",
              "id": 3,
              "method": "tools/call",
              "params": {
                  "name": "search_territories",
                  "arguments": {
                      "query": "Santa Fe",
                      "resource": "provincias",
                      "limit": 10,
                  },
              },
          })
          assert not called.get("result", {}).get("isError", False), called
          result_text = next(
              item["text"] for item in called["result"]["content"]
              if item.get("type") == "text"
          )
          assert json.loads(result_text)["data"][0]["geo_id"] == "82"
          print("Cloudflare production smoke test passed.")
          PY
