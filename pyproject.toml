[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "argentina-open-data"
version = "0.2.0"
description = "Evidence-first data kernel, REST API and MCP server for Argentina Open Data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi==0.156.8",
  "mcp==2.3.0",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
argentina-open = "argentina_open_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argentina_open_data"]

[tool.hatch.build]
include = [
  "src/argentina_open_data/**/*.py",
  "src/argentina_open_data/web/*.html",
  "src/argentina_open_data/seed_snapshots/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long URLs and policy text may exceed the source-code line target; keep other lint checks strict.
ignore = ["E501"]
