[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "argentina-open-data-kernel"
version = "0.1.0"
description = "Evidence-first data kernel for Argentina Open Data and Argentina Open MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Argentina Open Data contributors" }]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/argentina_open_data"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
